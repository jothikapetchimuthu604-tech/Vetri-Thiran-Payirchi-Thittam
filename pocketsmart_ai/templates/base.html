<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PocketSmart AI{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>
  <div class="bg-orb orb-three"></div>

  <nav class="navbar glass-panel">
    <a class="brand" href="/">📦 PocketSmart<span>AI</span></a>
    <div class="nav-links">
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/home-planner">Home</a>
        <a href="/party-planner">Party</a>
        <a href="/jewelry-planner">Jewelry</a>
        <a href="/history">History</a>
        <a href="/logout" class="btn-outline">Logout ({{ user }})</a>
      {% else %}
        <a href="/login">Sign In</a>
        <a href="/register" class="btn-solid">Get Started</a>
      {% endif %}
    </div>
  </nav>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>© 2026 PocketSmart AI — Built for a Naan Mudhalvan / student capstone project.</p>
  </footer>
</body>
</html>
